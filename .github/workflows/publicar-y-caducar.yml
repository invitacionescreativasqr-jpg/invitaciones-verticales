name: Publicar invitaciones verticales y retirar vencidas
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-verticales
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Retirar vencidas y preparar publicación
        run: python3 caducar-invitaciones.py
      - name: Guardar retirada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update -- 'vertical-*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Retirar invitaciones verticales vencidas'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deploy
